
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: simulado-nuvem
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: leitor-web
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

          env:
            - name: TOKEN_TESTE
              valueFrom:
                secretKeyRef:
                  name: senha-app
                  key: token

          volumeMounts:
            - name: pagina-volume
              mountPath: /usr/share/nginx/html

          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: pagina-volume
          configMap:
            name: pagina

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: simulado-nuvem
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
