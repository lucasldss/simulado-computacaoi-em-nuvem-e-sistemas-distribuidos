
apiVersion: batch/v1
kind: CronJob
metadata:
  name: verifica-web
  namespace: simulado-nuvem
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: verificador
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - wget -qO- http://web
